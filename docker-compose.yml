services:
  app:
    build: .
    depends_on: 
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    env_file:
      - .env
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4000/doc || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    profiles: ["debug"]
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      app:                        
        condition: service_healthy
    restart: on-failure           

volumes:
  pg_data:

networks:
  default:
    driver: bridge